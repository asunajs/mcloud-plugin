<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mcloud 插件 · 分组与操作</title>
  <!-- 复用主面板的主题变量与组件样式；再叠一层插件自己的 style.css -->
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <header class="page-head">
      <div>
        <h1 class="plugin-title">mcloud 插件</h1>
        <p class="plugin-sub">
          按<b>风险与依赖</b>分组，不按功能名 —— 操作一条任务前，真正要知道的是
          「它安不安全、要哪种凭据」。
        </p>
      </div>
      <div class="head-actions">
        <button id="refresh" class="btn">刷新</button>
      </div>
    </header>

    <p id="summary" class="summary">加载中…</p>
    <p id="error" class="error" hidden></p>

    <!-- 会话：插件自己才知道的东西（主面板不管这个） -->
    <section class="card" id="session-card">
      <div class="card-head">
        <h2>会话</h2>
        <span class="card-sub" id="session-status">查状态中…</span>
      </div>
      <div class="row">
        <input id="session-input" class="input" type="password" autocomplete="off"
               placeholder="粘 cookie 串（导法见插件仓库 docs/howto-session.md）">
        <button id="session-save" class="btn btn-primary">导入并验证</button>
        <button id="session-check" class="btn">只验证</button>
      </div>
      <p class="hint">
        凭据只进 SQLite 的 <code>state</code> 表，**任何接口都不回显**；
        页面上的输入框不会被回填。
      </p>
      <div class="row">
        <label class="label">上游地址</label>
        <input id="base-url" class="input" placeholder="留空 = 用默认上游">
        <button id="base-save" class="btn">保存</button>
      </div>
      <p class="hint" id="base-hint"></p>
    </section>

    <!-- 只读任务采集来的读数：界面要能看见，否则"只读"就只是日志里的一行数 -->
    <section class="card" id="matrix-card" hidden>
      <div class="card-head">
        <h2>App 任务矩阵</h2>
        <span class="card-sub" id="matrix-sub"></span>
      </div>
      <p class="why">
        <b>只看，不写</b>：一个字节都不发。一次触发读一个 group（8 个一轮），
        所以下面的格子会一个个填满 —— 想立刻看下一组，去任务列表点
        <code>app-task-matrix</code> 的「立即执行」。
      </p>
      <table class="tasks" id="matrix-table">
        <thead><tr><th>group</th><th>已完成</th><th>可做</th><th>不参与</th><th>可做的</th><th>读到时间</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="card" id="exchange-card" hidden>
      <div class="card-head">
        <h2>兑换清单</h2>
        <span class="card-sub" id="exchange-sub"></span>
      </div>
      <p class="why" id="exchange-note"></p>
      <div id="exchange-ok"></div>
      <p class="hint" id="exchange-tiers"></p>
    </section>

    <div id="groups"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
