name: Release

# 打一个**面板能直接装**的 0.4 形状 zip，挂到 GitHub Release 上。
#
# ⚠ 2026-11-14 改成「只手动触发」：
#   · 这条仓现在只面向 0.4（见 README「面板契约（0.4）」R5），产物是
#     `dist/panel-llrt/mcloud-plugin-<version>-panel04.zip`（`npm run pack:panel04`）；
#   · 发布动作由维护者从**干净 worktree + tag** 跑（`git worktree add` → `pack:panel04`），
#     这样 zip 的 sha256 与发布出去的一致 —— 之前在工作树里直接打，包里混进了别人未提交的
#     改动，sha256 对不上只能重做；
#   · 所以**不再**在 push tag 时自动建 release：那会和手动上传的资产同名覆盖，
#     一次「同名但 sha256 不同」的覆盖就足以让货架上的 sha256 变成孤儿。
#
# 要发的话：Actions → Release → Run workflow（填已存在的 tag）。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.4.0，必须已经存在且与 package.json 一致）'
        required: true

permissions:
  contents: write # 建 Release 要写权限

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci --no-audit --no-fund

      # 发布前把该跑的跑完。**不通过就不发** —— 一个"能下载但跑不起来"的产物比没有更糟。
      - name: 常量可复现
        run: |
          set -euo pipefail
          npm run gen
          git diff --exit-code -- src/crypto/tables.ts \
            || { echo "❌ src/crypto/tables.ts 与生成脚本的结果不一致"; exit 1; }
      - name: 类型检查
        run: npm run typecheck
      - name: 单元测试
        run: npm test
      - name: 产物与源码一致
        run: npm run check-build

      # tag 与 package.json 的版本必须对得上，否则 zip 名字会骗人
      # （`mcloud-plugin-0.4.0-panel04.zip` 里装的是别的版本的代码）。
      - name: tag 与 package.json 版本一致
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          VER=$(node -p "require('./package.json').version")
          if [ "v$VER" != "$TAG" ]; then
            echo "❌ tag=$TAG 与 package.json version=$VER 对不上"
            exit 1
          fi
          echo "✅ tag $TAG == package.json $VER"

      # 0.4 形状：全部平铺（<name>.js + <name>.panel.json + mcloud.webui/）。
      # 打包脚本只认 dist/panel-llrt/ 里**刚构建**的产物，所以先构建。
      - name: 构建 + 打包（0.4 形状）
        run: |
          set -euo pipefail
          npm run build:panelllrt
          npm run pack:panel04

      - name: 挂到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          ZIP=$(ls dist/*-panel04.zip)
          SUM="$ZIP.sha256"
          # 已经存在就先补传（发布要幂等：同一个 tag 重跑一次得到同一个结果）
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$SUM" --clobber
            echo "✅ 已有 release，产物已覆盖更新"
          else
            gh release create "$TAG" \
              --title "mcloud-plugin $TAG" \
              --generate-notes \
              --notes "面板 0.4 能直接装的 zip：**插件管理 → 上传**选中下面这个 \`.zip\`（也可以解压进 \`PLUGINS_DIR\`）。装完打开「云盘」导入会话，再点一次「日常」。" \
              "$ZIP" "$SUM"
          fi
          echo "✅ https://github.com/${{ github.repository }}/releases/tag/$TAG"
