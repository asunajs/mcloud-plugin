name: CI

# 两个 job，成本差很多，所以触发条件不同：
#
#   check       ~30 秒。类型检查、测试、常量可复现、产物与源码一致。
#               **每次推送都跑** —— 它便宜，而且这几条正是「本地忘了跑」的那种错。
#   panel-e2e   ~5 分钟（要现构建面板的 Rust）。插件的真正验收是「在真面板里能跑」，
#               所以它必须在 CI 里，但没必要每次推送都跑 —— 只在 tag / 手动 / PR 上跑。
#
# 真 ARM64 硬件（ubuntu-24.04-arm）：目标机是低配 ARM 盒子，而这个插件是拿它压边界的，
# 用 x86 跑 E2E 得到的结论不能直接搬到目标平台。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: 静态检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund

      # 常量必须可复现：生成结果与提交的一致
      - name: SHA-2 常量可复现
        run: |
          npm run gen
          git diff --exit-code -- src/crypto/tables.ts \
            || { echo "❌ src/crypto/tables.ts 与生成脚本的结果不一致"; exit 1; }

      - name: 类型检查（src 不许出现 Node 类型）
        run: npm run typecheck

      - name: 单元测试（密码学对 Node 的 crypto 逐用例比对）
        run: npm test

      # 产物是提交进仓库的（面板加载的是它）。只跑测的话，完全可以
      # 「源码改了、忘了重新构建」——全绿，而面板跑的还是旧逻辑。
      - name: 产物与源码一致
        run: npm run check-build

  panel-e2e:
    name: 在真面板里跑（真 ARM64）
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 取出插件
        uses: actions/checkout@v4
        with:
          path: plugin
      - name: 取出面板
        uses: actions/checkout@v4
        with:
          repository: asunajs/panel
          path: panel
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: panel

      - name: 构建面板
        run: cargo build --release
        working-directory: panel

      - name: 起面板（PLUGINS_DIR 指向本仓库的插件）
        working-directory: panel
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          echo "TMP=$TMP" >> "$GITHUB_ENV"
          PANEL_TOKEN=ci-token-plugin \
          BIND_ADDR=127.0.0.1:18795 \
          DB_PATH="$TMP/panel.db" \
          PLUGINS_DIR="$GITHUB_WORKSPACE/plugin/plugins" \
            ./target/release/plugin-panel > "$TMP/panel.log" 2>&1 &
          echo "PID=$!" >> "$GITHUB_ENV"

      # 等引擎把插件装完，**不能只等 HTTP 起来**。
      #
      # 第一次跑就是在这一步红的：`/api/state` 一开始能返回 200 时引擎还没装完插件，
      # `plugins` 是空数组 —— 断言在插件装好前 40 毫秒就下了结论。
      # 这是这个项目里反复出现的一类错（「断言下得太早」），所以这里等的是
      # **任务真的出现在调度器里**，而不是接口通不通。
      #
      # 两个坑都踩过，写在配置里免得后人重踩：
      #   ① `/api/state` 没法区分「没有插件」和「还没装完」（F-003）
      #   ② 任务定义在 **`jobs`** 字段里；`tasks` 是「正在跑的调用」（F-004）
      #   ③ 循环里等到就 break，**等不到必须 exit 1** —— 第一版忘了，
      #      于是 60 次都没等到也算这一步成功，错误被推到下一步、变得难查
      - name: 等插件装好（不是等接口通）
        run: |
          set -euo pipefail
          got=0
          for i in $(seq 1 60); do
            curl -fsS -H 'X-Panel-Token: ci-token-plugin' \
              http://127.0.0.1:18795/api/state -o "$TMP/state.json" 2>/dev/null || true
            if python3 -c "
          import json, os, sys
          try:
              s = json.load(open(os.environ['TMP'] + '/state.json'))
          except Exception:
              sys.exit(1)
          names = {j['name'] for j in s.get('jobs', [])
                   if j.get('plugin') == 'mcloud' and not j.get('deleted')}
          sys.exit(0 if {'selftest', 'diag'} <= names else 1)
          " 2>/dev/null; then
              echo "✅ 插件与它的任务都已就位（第 $i 次探测）"
              got=1
              break
            fi
            sleep 0.5
          done
          if [ "$got" != 1 ]; then
            echo "❌ 30 秒内没等到插件任务进入调度器"
            python3 -c "
          import json, os
          s = json.load(open(os.environ['TMP'] + '/state.json'))
          print('plugins =', s.get('plugins'))
          print('jobs    =', s.get('jobs'))
          "
            exit 1
          fi

      - name: 插件加载了、任务登记了、没有错
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          state = json.load(open(os.environ['TMP'] + '/state.json'))
          plugins = {p['name']: p for p in state['plugins']}
          p = plugins.get('mcloud')
          assert p, f"没有加载 mcloud 插件，只有 {list(plugins)}"
          assert p['runtime'] == 'js', p
          assert p.get('error') in (None, ''), p
          assert p['tasks'] == 2, f"插件报的任务数是 {p['tasks']}，期望 2"
          # 任务定义在 **jobs** 里（`tasks` 是「正在跑的调用」，见 F-004）；
          # 插件条目上的 `tasks` 是数量，不是列表
          mine = [j for j in state.get('jobs', []) if j.get('plugin') == 'mcloud']
          names = sorted(j['name'] for j in mine)
          assert names == ['diag', 'selftest'], f"实际任务名 {names}"
          assert all(not j.get('deleted') for j in mine), mine
          assert all(j.get('last_error') in (None, '') for j in mine), mine
          print(f"✅ 插件 mcloud 已加载：runtime={p['runtime']} 任务 {names}（调度器里都登记了、无 last_error）")
          PY

      - name: 沙箱内的自检必须通过（这是 M0 的核心证据）
        run: |
          set -euo pipefail
          curl -fsS -X POST -H 'X-Panel-Token: ci-token-plugin' -H 'x-panel: 1' \
            http://127.0.0.1:18795/api/tasks/mcloud/selftest/run
          sleep 3
          grep -q "自检通过" "$TMP/panel.log" \
            || { echo "❌ 沙箱内自检没有通过"; grep -i mcloud "$TMP/panel.log"; exit 1; }
          if grep -q "自检失败" "$TMP/panel.log"; then
            echo "❌ 沙箱内自检失败"; grep -i mcloud "$TMP/panel.log"; exit 1
          fi
          echo "✅ 沙箱内自检通过（密码学 / UTF-8 / base64 / SQLite 都跑在这台 ARM64 上的 QuickJS 里）"

      - name: 手动触发的负延迟要被排除、不能污染统计（F-001 的绕开）
        run: |
          set -euo pipefail
          for _ in $(seq 1 10); do
            curl -fsS -o /dev/null -X POST -H 'X-Panel-Token: ci-token-plugin' -H 'x-panel: 1' \
              http://127.0.0.1:18795/api/tasks/mcloud/diag/run
            sleep 0.2
          done
          sleep 1
          grep -q "排除负延迟 10 条" "$TMP/panel.log" \
            || { echo "❌ 负延迟没有被排除（或没报出来）"; grep -E "调度健康" "$TMP/panel.log"; exit 1; }
          echo "✅ 10 次手动触发产生了 10 条负延迟，全部被排除且单独计数"

      # ══════════ 对着 mock 上游跑完整条链（CI 绝不碰真账号）══════════
      #
      # 到这一步为止，我们验证的是「插件装上了、任务登记了、自检过了」。
      # 这一段往前推一格：把**上游指向 mock**，导入一份假会话，真跑一次 task-list，
      # 然后断言三件事 —— 任务成功、状态落盘、以及 **mock 收到的字节**。
      #
      # 最后那条是重点：签名错是这条链最常见的失败，而它在真机上只有一句
      # 「签名错误」。断言收到的 body 与四个签名头自洽，等于把协议钉在 CI 里。
      - name: 起 mock 上游
        run: |
          set -euo pipefail
          node plugin/mock/upstream.mjs 19099 > "$TMP/mock.log" 2>&1 &
          echo "MOCK_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:19099/_debug/requests >/dev/null 2>&1; then
              echo "✅ mock 上游已起"; exit 0
            fi
            sleep 0.5
          done
          echo "❌ mock 没起来"; cat "$TMP/mock.log"; exit 1

      - name: 把插件指向 mock，导入假会话，真跑一次 task-list
        run: |
          set -euo pipefail
          P="-H X-Panel-Token:ci-token-plugin"
          W="$P -H x-panel:1"          # 写接口要 x-panel: 1（面板的 CSRF 防护，插件路由同样适用）
          B=http://127.0.0.1:18795

          # ① 基址指到 mock（沙箱里读不到环境变量，所以走 state + 接口）
          curl -fsS $W -X POST -d '{"baseUrl":"http://127.0.0.1:19099"}' $B/plugins/mcloud/api/config
          echo

          # ② 导入假会话：导入时会立刻真验一次（打到 mock）
          curl -fsS $W -X POST -d '{"session":"mockcookie=1"}' $B/plugins/mcloud/api/session \
            > "$TMP/import.json"
          # ③ 真跑一次 task-list（mock 夹具：3 条，其中 2 条 FINISH）
          curl -fsS $W -X POST $B/api/tasks/mcloud/task-list/run
          echo
          sleep 2
          # ④ 取插件自己的状态
          curl -fsS $P $B/plugins/mcloud/api/tasks > "$TMP/plugin-state.json"

          python3 - <<'PY'
          import json, os

          t = os.environ['TMP']
          imp = json.load(open(t + '/import.json'))
          assert imp['imported'], imp
          assert imp['verified'], '对 mock 的验证应当通过：' + str(imp.get('note'))
          # 凭据不回显（`savedAt` 里也有 cookie 的脱敏摘要，所以整段 JSON 一起查）
          assert 'mockcookie=1' not in json.dumps(imp), imp
          print('✅ 会话导入并对 mock 验证通过，且响应里没有凭据原文')

          d = json.load(open(t + '/plugin-state.json'))
          last = d['lastTaskList']
          assert last, '没有落盘清单：' + json.dumps(d)
          assert last['total'] == 3, last
          assert last['done'] == 2, last
          assert d['lastError'] is None, d['lastError']
          print('✅ task-list 跑通：清单 %d 条、已完成 %d 条' % (last['total'], last['done']))
          PY

      - name: 断言 mock 收到的字节（body 逐字节、头齐全、签名自洽）
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:19099/_debug/requests -o "$TMP/mock-req.json"
          python3 - <<'PY'
          import hashlib, json, os

          reqs = json.load(open(os.environ['TMP'] + '/mock-req.json'))
          paths = [r['path'] for r in reqs]
          tl = [r for r in reqs if r['path'] == '/ycloud/signin/task/taskListV3']
          assert tl, 'mock 没收到 taskListV3，只收到：' + str(paths)

          h = tl[-1]['headers']
          body = tl[-1]['body']

          # body 逐字节（实拍 content-length 62 就是这个串）
          want = '{"marketname":"sign_in_3","clientVersion":"12.6.0","group":""}'
          assert body == want, 'body 不对：' + repr(body)

          # 头齐全（这一口:带 activityid/appversion，不带 isdeviceid）
          assert h['activityid'] == 'sign_in_3', h
          assert h['appversion'] == '12.6.0.0', h
          assert h['content-type'] == 'application/json;charset=UTF-8', h
          assert h['cookie'] == 'mockcookie=1', h
          assert h.get('showloading') == 'true', h
          assert 'isdeviceid' not in h, h
          assert 'jwttoken' not in h, '这一份会话没有 jwt，不该发这枚头：' + str(h)

          # 签名自洽：用收到的那三个值重算，必须等于收到的 x-signature
          salt = 'seedMdYYLIZfbCxg'
          want_sig = hashlib.md5(
              (salt + h['x-request-id'] + h['x-timestamp'] + h['x-nonce'] + salt).encode()
          ).hexdigest()
          assert h['x-signature'] == want_sig, '签名不匹配：' + h['x-signature'] + ' != ' + want_sig
          print('✅ mock 收到的字节全对：body 逐字节、头齐全、签名自洽')
          # 顺带确认体检那一口是 GET + ?client=app（我写错过 POST，上游回 405）
          info = [r for r in reqs if r['path'].startswith('/ycloud/signin/page/infoV3')]
          assert info, '没有体检请求：' + str(paths)
          assert info[-1]['method'] == 'GET', info[-1]['method']
          assert info[-1]['path'] == '/ycloud/signin/page/infoV3?client=app', info[-1]['path']
          print('✅ 体检请求也是对的：GET /ycloud/signin/page/infoV3?client=app')
          PY

      - name: 失败时把面板日志打出来
        if: failure()
        run: |
          echo "──── 面板日志 ────"
          tail -60 "$TMP/panel.log" || true
