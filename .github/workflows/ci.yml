name: CI

# 两个 job，成本差很多，所以触发条件不同：
#
#   check       ~40 秒。类型检查、测试、常量可复现、产物与源码一致。
#               **每次推送都跑** —— 它便宜，而且这几条正是「本地忘了跑」的那种错。
#   panel-e2e   ~8 分钟（要现构建面板的 Rust）。插件的真正验收是「在真面板里能跑」，
#               所以它必须在 CI 里，但没必要每次推送都跑 —— 只在手动 / tag 上跑。
#
# 真 ARM64 硬件（ubuntu-24.04-arm）：目标机是低配 ARM 盒子。
#
# ⚠ 只面向 panel-llrt（0.4/0.5 线）。旧面板（rust-plugin-panel / 0.3.x）的产物
#   本仓不再构建，那条 CI 分支也随 P1 删掉了（要取回看 tag legacy-0.4.2-sync）。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: 静态检查与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund

      # 常量必须可复现：生成结果与提交的一致
      - name: SHA-2 常量可复现
        run: |
          npm run gen
          git diff --exit-code -- src/crypto/tables.ts \
            || { echo "❌ src/crypto/tables.ts 与生成脚本的结果不一致"; exit 1; }

      - name: 类型检查（核心层不许出现 Node 类型）
        run: npm run typecheck

      - name: 单元测试（密码学对 Node 的 crypto 逐用例比对）
        run: npm test

      # 产物是提交进仓库的（面板加载的是它）。只跑测的话，完全可以
      # 「源码改了、忘了重新构建」——全绿，而面板跑的还是旧逻辑。
      - name: 产物与源码一致
        run: npm run check-build

  panel-e2e:
    name: 在真面板里跑（真 ARM64）
    # 手动触发才跑：它要现构建面板的 Rust（~8 分钟），而且 mock 夹具仍在补齐
    # （见 docs/findings.md F-115）。已经修好的断言留在里面，别删。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 取出插件
        uses: actions/checkout@v4
        with:
          path: plugin
      - name: 取出面板
        uses: actions/checkout@v4
        with:
          repository: asunajs/panel
          path: panel
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: panel

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 装依赖并构建插件产物
        working-directory: plugin
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 构建面板
        run: cargo build --release
        working-directory: panel

      - name: 起面板（插件目录指向本仓库构建产物）
        working-directory: plugin
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          echo "TMP=$TMP" >> "$GITHUB_ENV"
          mkdir -p "$TMP/data"
          # panel-llrt：监听地址在 data/config.json 里（不是环境变量）
          printf '{"server":{"bind":"127.0.0.1:18795"}}' > "$TMP/data/config.json"
          # ⚠ PANEL_ALLOW_PLAIN_TOKEN=1 不能省：面板默认拒绝明文口令，会**直接退出**。
          #   少了它的症状是"等 30 秒没等到插件"，很容易被误判成"插件加载慢"。
          PANEL_DATA_DIR="$TMP/data" \
          PANEL_PLUGINS_DIR="$GITHUB_WORKSPACE/plugin/dist/panel-llrt" \
          PANEL_TOKEN=ci-token-plugin \
          PANEL_ALLOW_PLAIN_TOKEN=1 \
            "$GITHUB_WORKSPACE/panel/target/release/panel" > "$TMP/panel.log" 2>&1 &
          echo "PID=$!" >> "$GITHUB_ENV"

      # 等引擎把插件装完，**不能只等 HTTP 起来**（F-003：接口早 40ms 通，插件还是空数组）。
      # 断言写在 scripts/ci_state_check.py 里，不写 heredoc（缩进一改就静默坏）。
      - name: 等插件装好（不是等接口通）
        run: |
          set -euo pipefail
          got=0
          for i in $(seq 1 60); do
            curl -fsS -H 'X-Panel-Token: ci-token-plugin' \
              http://127.0.0.1:18795/api/state -o "$TMP/state.json" 2>/dev/null || true
            if python3 plugin/scripts/ci_state_check.py ready "$TMP/state.json"; then
              echo "✅ 4 个插件 + 3 条任务都已就位（第 $i 次探测）"
              got=1
              break
            fi
            sleep 0.5
          done
          if [ "$got" != 1 ]; then
            echo "❌ 30 秒内没等到插件与任务就位"
            python3 -c "
          import json, os
          s = json.load(open(os.environ['TMP'] + '/state.json'))
          print('plugins =', [p['name'] for p in s.get('plugins', [])])
          print('tasks   =', [t['name'] for t in (s.get('tasks') or s.get('jobs') or [])])
          "
            exit 1
          fi

      - name: 插件加载了、任务登记了、没有错
        run: python3 plugin/scripts/ci_state_check.py loaded "$TMP/state.json"

      - name: 沙箱内的自检必须通过
        run: |
          set -euo pipefail
          # 自检是**路由**不是任务，所以这里是 GET。
          curl -fsS -H 'X-Panel-Token: ci-token-plugin' \
            http://127.0.0.1:18795/plugins/mcloud/api/selftest -o "$TMP/selftest.json"
          python3 plugin/scripts/ci_state_check.py selftest "$TMP/selftest.json"

      # 对着 mock 上游跑完整条链（CI 绝不碰真账号）—— 与本地同一份脚本
      - name: 对着 mock 上游跑完整条链
        run: |
          set -euo pipefail
          mkdir -p "$TMP/mock-e2e"
          E2E_KEEP=0 bash plugin/scripts/e2e-mock.sh "$GITHUB_WORKSPACE/panel/target/release/panel" 18950 \
            2>&1 | tee "$TMP/mock-e2e/out.log"

      - name: 失败时把面板日志打出来
        if: failure()
        run: |
          echo "──── 面板日志 ────"
          tail -60 "$TMP/panel.log" || true
